<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Planta 3D · Casa à venda na Barra de São Miguel</title>
<meta name="description" content="Planta 3D interativa da casa à venda na Barra de São Miguel, Alagoas: 2 quartos, sala com cozinha americana, varanda com redes, área gourmet com churrasqueira, piscina e garagem coberta.">
<meta name="theme-color" content="#06303c">
<meta property="og:title" content="Planta 3D · Casa à venda na Barra de São Miguel">
<meta property="og:description" content="Gire a casa com o dedo, tire a cobertura e entre em cada ambiente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Jost:wght@300..600&display=swap" rel="stylesheet">
<style>
:root{
  --mar:#06303c; --mar-2:#0d4c5f; --turq:#17b6c4; --turq-2:#49d4de;
  --coral:#f2683c; --areia:#f7f1e6; --suave:#93a4ab;
  --sans:'Jost',system-ui,-apple-system,sans-serif;
  --display:'Archivo',system-ui,sans-serif;
  --borda:rgba(73,212,222,.32);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#cfe4ea;
  font:300 15px/1.6 var(--sans);color:var(--mar);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:var(--sans);color:inherit;cursor:pointer;border:0;background:none}
#cena{position:fixed;inset:0;touch-action:none}
#cena canvas{display:block}
#rotulos{position:fixed;inset:0;pointer-events:none;z-index:5}

.topo{position:fixed;z-index:30;top:max(12px,env(safe-area-inset-top));left:50%;
  transform:translateX(-50%);display:flex;align-items:center;gap:13px;
  padding:6px 6px 6px 16px;border-radius:999px;
  background:rgba(6,48,60,.7);backdrop-filter:blur(16px) saturate(1.35);
  -webkit-backdrop-filter:blur(16px) saturate(1.35);
  border:1px solid var(--borda);color:var(--areia);white-space:nowrap;
  box-shadow:0 14px 44px -20px rgba(0,0,0,.6);max-width:calc(100vw - 20px)}
.topo .marca{font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;
  display:flex;align-items:center;gap:9px;overflow:hidden;text-overflow:ellipsis}
.topo .marca svg{width:20px;height:20px;flex:none;color:var(--turq-2)}
.topo a{color:#fff;text-decoration:none;font:700 11.5px var(--display);letter-spacing:.1em;
  text-transform:uppercase;padding:10px 16px;border-radius:999px;background:var(--coral);
  transition:background .2s}
.topo a:hover{background:#cf4a22}

.titulo{position:fixed;z-index:15;left:max(16px,env(safe-area-inset-left));top:78px;max-width:330px;
  padding:20px 22px;border-radius:18px;background:rgba(6,48,60,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--borda);box-shadow:0 22px 54px -30px rgba(0,0,0,.8);
  transition:opacity .35s,transform .35s;color:rgba(247,241,230,.8)}
.titulo.fechado{opacity:0;transform:translateY(-10px);pointer-events:none}
.titulo small{display:block;font:700 9.5px var(--display);letter-spacing:.28em;
  text-transform:uppercase;color:var(--turq-2);margin-bottom:9px}
.titulo h1{font:900 26px/1 var(--display);color:#fff;letter-spacing:-.03em;text-transform:uppercase}
.titulo h1 em{display:block;font-style:normal;color:var(--turq-2)}
.titulo p{font-size:13.2px;line-height:1.6;margin-top:11px}
.titulo .fecha{position:absolute;top:8px;right:10px;width:30px;height:30px;border-radius:50%;
  font-size:20px;line-height:1;color:var(--suave);display:grid;place-items:center}
.titulo .fecha:hover{background:rgba(247,241,230,.12)}

.amb{position:fixed;z-index:15;right:max(13px,env(safe-area-inset-right));top:78px;
  width:214px;max-height:calc(100vh - 200px);overflow:auto;
  padding:11px;border-radius:18px;background:rgba(6,48,60,.9);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--borda);box-shadow:0 22px 54px -32px rgba(0,0,0,.8);
  scrollbar-width:thin;color:rgba(247,241,230,.86)}
.amb h4{font:700 9px var(--display);letter-spacing:.24em;text-transform:uppercase;
  color:var(--turq-2);padding:9px 8px 5px}
.amb button{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:8px;
  padding:8px 10px;border-radius:9px;font-size:13.4px;text-align:left;transition:background .18s}
.amb button:hover{background:rgba(247,241,230,.1)}
.amb button.on{background:var(--turq-2);color:var(--mar);font-weight:500}

.ctrl{position:fixed;z-index:20;left:50%;transform:translateX(-50%);
  bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:9px;
  padding:8px;border-radius:999px;background:rgba(6,48,60,.74);
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid var(--borda);box-shadow:0 16px 44px -22px rgba(0,0,0,.8);
  max-width:calc(100vw - 20px);overflow:auto;scrollbar-width:none}
.ctrl::-webkit-scrollbar{display:none}
.seg{display:flex;background:rgba(247,241,230,.12);border-radius:999px;padding:3px;flex:none}
.seg button{padding:8px 15px;border-radius:999px;font:400 12.5px var(--sans);
  color:rgba(247,241,230,.8);white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:var(--turq-2);color:var(--mar);font-weight:500}
.ctrl .ic{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:rgba(247,241,230,.12);color:var(--areia);transition:background .2s}
.ctrl .ic:hover{background:rgba(73,212,222,.34)}
.ctrl .ic svg{width:18px;height:18px}

.rot{font:500 11.8px var(--sans);color:#fff;white-space:nowrap;
  padding:4px 10px;border-radius:999px;background:rgba(6,48,60,.84);
  border:1px solid rgba(73,212,222,.36);transition:opacity .25s;
  text-shadow:0 1px 3px rgba(0,0,0,.5)}
.rot.off{opacity:0}
.rot b{font-weight:500}

.dica{position:fixed;z-index:18;left:50%;transform:translateX(-50%);
  bottom:calc(max(16px,env(safe-area-inset-bottom)) + 62px);
  padding:8px 16px;border-radius:999px;background:rgba(6,48,60,.74);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--borda);color:rgba(247,241,230,.9);
  font:400 12.4px var(--sans);white-space:nowrap;transition:opacity .6s}
.dica.off{opacity:0;pointer-events:none}

body.embed .topo,body.embed .titulo,body.embed .amb,body.embed .ctrl,body.embed .dica{display:none}
body.embed .rot{display:none}
#carregando{position:fixed;inset:0;z-index:95;display:grid;place-items:center;
  background:#cfe4ea;transition:opacity .5s}
#carregando.off{opacity:0;pointer-events:none}
#carregando div{display:grid;place-items:center;gap:14px}
#carregando b{font:900 20px var(--display);letter-spacing:-.02em;color:var(--mar);text-transform:uppercase}
#carregando i{display:block;width:44px;height:44px;border-radius:50%;
  border:3px solid rgba(6,48,60,.18);border-top-color:var(--coral);
  animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

@media (max-width:900px){
  .amb{display:none}
  .titulo{max-width:min(300px,calc(100vw - 32px));top:72px;padding:16px 18px}
  .titulo h1{font-size:22px}
  .titulo p{font-size:12.6px}
  .topo{gap:9px;padding:5px 5px 5px 13px}
  .topo .marca{font-size:10.5px;letter-spacing:.12em}
  .topo a{font-size:10.5px;padding:9px 13px}
  .dica{font-size:11.6px;white-space:normal;max-width:calc(100vw - 28px);text-align:center}
  .ctrl{flex-wrap:wrap;justify-content:center;border-radius:26px;overflow:visible;
    gap:7px;padding:7px;max-width:calc(100vw - 22px)}
  .seg button{padding:8px 13px;font-size:12px}
  .rot{font-size:11px;padding:3px 9px}
  .ctrl .ic{width:34px;height:34px}
}
</style>
</head>
<body>

<div id="cena"></div>
<div id="rotulos"></div>

<div class="topo">
  <span class="marca">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 21h18"/><path d="M5 21V9l7-5 7 5v12"/><path d="M10 21v-6h4v6"/>
    </svg>
    Casa à venda · Barra de São Miguel
  </span>
  <a href="../">Voltar ao site</a>
</div>

<div class="titulo" id="titulo">
  <button class="fecha" id="fechaTitulo" aria-label="Fechar">&times;</button>
  <small>Planta 3D</small>
  <h1>Casa<em>à venda</em></h1>
  <p>Gire com o dedo, tire a cobertura e entre em cada ambiente. Modelo montado a partir das fotos da casa — medidas aproximadas.</p>
</div>

<div class="amb" id="amb"></div>

<div class="ctrl">
  <div class="seg" id="segCorte">
    <button data-n="fechado" class="on">Fechada</button>
    <button data-n="aberto">Sem telhado</button>
  </div>
  <div class="seg" id="segFoco">
    <button data-f="tudo" class="on">Tudo</button>
    <button data-f="casa">Quartos</button>
    <button data-f="lazer">Lazer</button>
  </div>
  <button class="ic" id="btnVista" title="Ver de cima" aria-label="Ver de cima">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
    </svg>
  </button>
  <button class="ic" id="btnReset" title="Vista inicial" aria-label="Vista inicial">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/>
    </svg>
  </button>
</div>

<div class="dica" id="dica">Arraste para girar · dois dedos para mover · pinça para aproximar</div>

<div id="carregando"><div><i></i><b>Montando a casa</b></div></div>

<script type="module">
import * as THREE from './vendor/three.module.min.js';
import { OrbitControls } from './vendor/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from './vendor/CSS2DRenderer.js';

/* ===================== BASE ===================== */
const host = document.getElementById('cena');
const MOBILE = innerWidth < 900 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const EMBED = /(?:\?|&)embed=1\b/.test(location.search);
if (EMBED) document.body.classList.add('embed');

const renderer = new THREE.WebGLRenderer({ antialias: !MOBILE, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
host.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer({ element: document.getElementById('rotulos') });
labelRenderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfe4ea');
scene.fog = new THREE.Fog('#cfe4ea', 62, 185);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .07;
controls.minDistance = 7;
controls.maxDistance = 115;
controls.maxPolarAngle = Math.PI / 2 - .03;
if (EMBED) { controls.autoRotate = true; controls.autoRotateSpeed = .55; controls.enabled = false; }

/* ===================== LUZ ===================== */
scene.add(new THREE.HemisphereLight('#eef8ff', '#bfc7a8', .95));
const sol = new THREE.DirectionalLight('#fff6e4', 2.85);
sol.position.set(-4, 34, 30);
sol.castShadow = true;
sol.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
sol.shadow.camera.left = -26; sol.shadow.camera.right = 26;
sol.shadow.camera.top = 40; sol.shadow.camera.bottom = -30;
sol.shadow.camera.near = 1; sol.shadow.camera.far = 110;
sol.shadow.bias = -0.0006;
sol.shadow.normalBias = 0.045;
scene.add(sol);
scene.add(new THREE.DirectionalLight('#dceeff', .4).translateX(20).translateY(14).translateZ(-22));

/* ===================== MEDIDAS =====================
   X = largura do terreno (0 a 15)  |  Z = profundidade (0 na rua, 27 no fundo)
   Garagem na frente, piscina e area gourmet no meio do lote, varanda comprida
   na frente da casa e a casa no fundo. Corredor coberto na lateral.          */
const LOTE = { x0: 0, x1: 15, z0: 0, z1: 27 };

const ESP = .16;
const PD  = 2.9;
const ALT_VAR = 3.0;

const CASA = { x0: 1.0, x1: 11.4, z0: 17.0, z1: 24.6 };

const T = {
  sala:    { x0: 1.0, x1: 7.0,  z0: 17.0, z1: 21.2, n: 'Sala e cozinha' },
  cozinha: { x0: 7.0, x1: 11.4, z0: 17.0, z1: 20.2, n: 'Cozinha' },
  quarto1: { x0: 1.0, x1: 5.4,  z0: 21.2, z1: 24.6, n: 'Quarto 1' },
  wc:      { x0: 5.4, x1: 7.8,  z0: 21.2, z1: 24.6, n: 'Banheiro' },
  quarto2: { x0: 7.8, x1: 11.4, z0: 20.2, z1: 24.6, n: 'Quarto 2' }
};

const EXT = {
  varanda:  { x0: 1.0,  x1: 11.4, z0: 14.0, z1: 17.0, n: 'Varanda com redes' },
  gourmet:  { x0: 1.0,  x1: 5.2,  z0: 7.2,  z1: 11.2, n: 'Área gourmet' },
  garagem:  { x0: 1.0,  x1: 7.6,  z0: 1.2,  z1: 5.6,  n: 'Garagem coberta' },
  piscina:  { x0: 6.4,  x1: 10.4, z0: 7.8,  z1: 11.4, n: 'Piscina' },
  deck:     { x0: 5.4,  x1: 11.4, z0: 6.6,  z1: 12.8, n: 'Área da piscina' },
  corredor: { x0: 11.4, x1: 13.4, z0: 6.6,  z1: 24.6, n: 'Corredor lateral' }
};

/* ===================== MATERIAIS ===================== */
const std = o => new THREE.MeshStandardMaterial(Object.assign({ roughness: .9, metalness: 0 }, o));
const M = {
  paredeExt:  std({ color: '#f6e9b8', roughness: .95 }),
  paredeAmar: std({ color: '#f2d472', roughness: .95 }),
  paredeInt:  std({ color: '#f4efe4' }),
  paredeWc:   std({ color: '#e7eef0', roughness: .6 }),
  tijolo:     std({ color: '#c8824f', roughness: .97 }),
  piso:       std({ color: '#ebe6d9', roughness: .5 }),
  pisoVar:    std({ color: '#d7cdb8', roughness: .72 }),
  pisoMolh:   std({ color: '#dcd6c7', roughness: .46 }),
  concreto:   std({ color: '#d2cdc3', roughness: .99 }),
  laje:       std({ color: '#cbc5b8', roughness: .95 }),
  telha:      std({ color: '#cfd4d4', roughness: .86 }),
  telhaBorda: std({ color: '#49514f', roughness: .85 }),
  granito:    std({ color: '#2c2a27', roughness: .3, metalness: .16 }),
  madeira:    std({ color: '#8a4b25', roughness: .62 }),
  madClara:   std({ color: '#a9793f', roughness: .76 }),
  movel:      std({ color: '#ddd6c9', roughness: .78 }),
  inox:       std({ color: '#b4b9b8', roughness: .32, metalness: .55 }),
  branco:     std({ color: '#f8f7f3', roughness: .55 }),
  cama:       std({ color: '#ded5bd', roughness: .95 }),
  colcha:     std({ color: '#9fc8cf', roughness: .96 }),
  preto:      std({ color: '#241f1a', roughness: .48 }),
  grama:      std({ color: '#5f9e4a', roughness: 1 }),
  gramaSint:  std({ color: '#4e9e52', roughness: 1 }),
  terra:      std({ color: '#b3a881', roughness: 1 }),
  agua:       new THREE.MeshStandardMaterial({ color: '#16b4d8', roughness: .08, metalness: .18, transparent: true, opacity: .95, emissive: '#0a5a72', emissiveIntensity: .3 }),
  borda:      std({ color: '#e8e3d6', roughness: .7 }),
  vidro:      new THREE.MeshPhysicalMaterial({ color: '#cfe2e6', roughness: .06, metalness: 0, transparent: true, opacity: .26, transmission: .5 }),
  esquadria:  std({ color: '#2f2a26', roughness: .5 }),
  folha:      std({ color: '#4e7a3c', roughness: 1 }),
  folhaEsc:   std({ color: '#3d6330', roughness: 1 }),
  tronco:     std({ color: '#7a6244', roughness: 1 }),
  pisoExt:    std({ color: '#dad5c9', roughness: .86 }),
  muro:       std({ color: '#f3dd8e', roughness: .93 }),
  muroTopo:   std({ color: '#d9c478', roughness: .95 }),
  portao:     std({ color: '#2f6e54', roughness: .55 }),
  sofa:       std({ color: '#5d7f93', roughness: .95 }),
  sofa2:      std({ color: '#b6764c', roughness: .95 }),
  deckMad:    std({ color: '#9c6b3e', roughness: .82 }),
  rede:       std({ color: '#e0604a', roughness: .95 }),
  rede2:      std({ color: '#f0c04a', roughness: .95 }),
  vime:       std({ color: '#7d6244', roughness: .9 }),
  espreg:     std({ color: '#5d5b57', roughness: .8 }),
  lona:       std({ color: '#e9e2cf', roughness: .94 }),
  vaso:       std({ color: '#b9b2a4', roughness: .94 }),
  carro:      std({ color: '#23262a', roughness: .42, metalness: .3 }),
  carro2:     std({ color: '#b9bec4', roughness: .4, metalness: .35 }),
  vidroCarro: new THREE.MeshPhysicalMaterial({ color: '#7f8b92', roughness: .12, metalness: .2, transparent: true, opacity: .7 })
};

/* ===================== GRUPOS ===================== */
const TETOS = [];
const G = {
  terreno:   new THREE.Group(),
  casa:      new THREE.Group(),
  mob:       new THREE.Group(),
  cobertura: new THREE.Group(),
  lazer:     new THREE.Group()
};
Object.values(G).forEach(g => scene.add(g));
const CX = (LOTE.x0 + LOTE.x1) / 2, CZ = (LOTE.z0 + LOTE.z1) / 2;
Object.values(G).forEach(g => g.position.set(-CX, 0, -CZ));

/* ===================== AJUDANTES ===================== */
function caixa(g, w, h, d, mat, x, y, z, sombra = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h / 2, z);
  m.castShadow = sombra; m.receiveShadow = true;
  g.add(m);
  return m;
}
function piso(g, r, mat, y = 0, esp = .07) {
  return caixa(g, r.x1 - r.x0, esp, r.z1 - r.z0, mat,
    (r.x0 + r.x1) / 2, y - esp, (r.z0 + r.z1) / 2, false);
}
function parede(g, eixo, fixo, a0, a1, y, alt, mat, vaos = []) {
  const segs = [];
  let cur = a0;
  const ord = vaos.slice().sort((p, q) => p.a - q.a);
  for (const v of ord) {
    const va = Math.max(a0, v.a), vb = Math.min(a1, v.b);
    if (vb <= va) continue;
    if (va > cur) segs.push([cur, va, y, alt]);
    const vy0 = v.y0 ?? 0, vy1 = v.y1 ?? alt;
    if (vy0 > 0) segs.push([va, vb, y, vy0]);
    if (vy1 < alt) segs.push([va, vb, y + vy1, alt - vy1]);
    cur = Math.max(cur, vb);
  }
  if (cur < a1) segs.push([cur, a1, y, alt]);
  for (const [s0, s1, sy, sh] of segs) {
    if (s1 - s0 < .005 || sh < .005) continue;
    if (eixo === 'x') caixa(g, s1 - s0, sh, ESP, mat, (s0 + s1) / 2, sy, fixo);
    else caixa(g, ESP, sh, s1 - s0, mat, fixo, sy, (s0 + s1) / 2);
  }
  for (const v of ord) {
    if (!v.vidro) continue;
    const vy0 = v.y0 ?? 0, vy1 = v.y1 ?? alt;
    const w = v.b - v.a, h = vy1 - vy0;
    if (w <= 0 || h <= 0) continue;
    if (eixo === 'x') {
      caixa(g, w, h, .04, M.vidro, (v.a + v.b) / 2, y + vy0, fixo, false);
      caixa(g, w, .07, .09, M.esquadria, (v.a + v.b) / 2, y + vy0, fixo, false);
      caixa(g, w, .07, .09, M.esquadria, (v.a + v.b) / 2, y + vy1 - .07, fixo, false);
    } else {
      caixa(g, .04, h, w, M.vidro, fixo, y + vy0, (v.a + v.b) / 2, false);
      caixa(g, .09, .07, w, M.esquadria, fixo, y + vy0, (v.a + v.b) / 2, false);
      caixa(g, .09, .07, w, M.esquadria, fixo, y + vy1 - .07, (v.a + v.b) / 2, false);
    }
  }
}
function coluna(g, x, z, alt, lado = .34, mat = M.paredeExt) {
  caixa(g, lado, alt, lado, mat, x, 0, z);
}
function telhado(g, r, y, beiral = .5) {
  const w = r.x1 - r.x0 + beiral * 2, d = r.z1 - r.z0 + beiral * 2;
  const cx = (r.x0 + r.x1) / 2, cz = (r.z0 + r.z1) / 2;

  caixa(g, .16, .1, d + .1, M.telhaBorda, r.x1 + beiral, y - .02, cz, false);

}
function coqueiro(g, x, z, h = 7) {
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(.16, .3, h, 7), M.tronco);
  tr.position.set(x, h / 2, z); tr.castShadow = true; g.add(tr);
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2;
    const f = new THREE.Mesh(new THREE.SphereGeometry(1.5, 7, 5), i % 2 ? M.folha : M.folhaEsc);
    f.scale.set(1, .18, .5);
    f.position.set(x + Math.cos(a) * 1.25, h - .15 - Math.abs(Math.sin(i)) * .22, z + Math.sin(a) * 1.25);
    f.rotation.y = -a; f.rotation.z = -.3;
    f.castShadow = true; g.add(f);
  }
}

function rede(g, x0, x1, z, y, mat) {

    new THREE.Vector3(0, -.58, 0),

  caixa(g, .26, .06, 1.5, M.madClara, r.x0 + .22, Y + 1.9, (r.z0 + r.z1) / 2, false);
  caixa(g, .26, .06, 1.5, M.madClara, r.x0 + .22, Y + 2.25, (r.z0 + r.z1) / 2, false);
  /* geladeira de bebidas */
  caixa(g, .64, 1.5, .66, std({ color: '#b8502f', roughness: .5 }), r.x0 + .5, Y + .08, r.z1 - .55);
})();

/* ===================== PISCINA, DECK E JARDIM ===================== */
(function () {
  const g = G.lazer, p = EXT.piscina, d = EXT.deck;
  /* deck de madeira em quatro faixas em volta da cuba */
  piso(g, { x0: d.x0, x1: d.x1, z0: d.z0, z1: p.z0 }, M.deckMad, .22, .22);
  piso(g, { x0: d.x0, x1: d.x1, z0: p.z1, z1: d.z1 }, M.deckMad, .22, .22);
  piso(g, { x0: d.x0, x1: p.x0, z0: p.z0, z1: p.z1 }, M.deckMad, .22, .22);
  piso(g, { x0: p.x1, x1: d.x1, z0: p.z0, z1: p.z1 }, M.deckMad, .22, .22);
  /* borda da piscina */
  caixa(g, p.x1 - p.x0 + .5, .1, .25, M.borda, (p.x0 + p.x1) / 2, .22, p.z0 - .12, false);
  caixa(g, p.x1 - p.x0 + .5, .1, .25, M.borda, (p.x0 + p.x1) / 2, .22, p.z1 + .12, false);
  caixa(g, .25, .1, p.z1 - p.z0 + .5, M.borda, p.x0 - .12, .22, (p.z0 + p.z1) / 2, false);
  caixa(g, .25, .1, p.z1 - p.z0 + .5, M.borda, p.x1 + .12, .22, (p.z0 + p.z1) / 2, false);
  /* cuba de fibra e agua */
  caixa(g, p.x1 - p.x0, 1.4, p.z1 - p.z0, M.fibra, (p.x0 + p.x1) / 2, -1.2, (p.z0 + p.z1) / 2, false);
  const ag = caixa(g, p.x1 - p.x0 - .1, 1.25, p.z1 - p.z0 - .1, M.agua,
    (p.x0 + p.x1) / 2, -1.05, (p.z0 + p.z1) / 2, false);
  ag.renderOrder = 2;
  /* cascata azul */
  caixa(g, .18, 1.5, .22, std({ color: '#2f7fd0', roughness: .4 }), p.x0 - .45, .22, p.z0 + 1.1);
  caixa(g, .5, .16, .22, std({ color: '#2f7fd0', roughness: .4 }), p.x0 - .25, 1.56, p.z0 + 1.1, false);

  /* jardim de grama ao lado do deck */
  piso(g, { x0: 1.0, x1: 5.4, z0: 11.2, z1: 12.8 }, M.gramaSint, .04, .1);
  piso(g, { x0: 1.0, x1: 5.4, z0: 5.6, z1: 7.2 }, M.gramaSint, .04, .1);
  /* caminho de pedras */
  for (let i = 0; i < 6; i++) caixa(g, .5, .05, .36, M.pedra, 3.0, .05, 5.9 + i * .22, false);

  /* bancos de madeira e guarda-sol */
  mesaMad(g, 7.0, 12.1);
  caixa(g, .1, 2.2, .1, M.inox, 10.6, .22, 12.2);
  caixa(g, 1.9, .1, 1.9, M.lona, 10.6, 2.3, 12.2, false);
  espreguicadeira(g, 11.0, 9.0, Math.PI / 2);

  /* coqueiros e arbustos */
  coqueiro(g, 12.4, 9.4, 5.6);
  coqueiro(g, 12.6, 14.6, 5.0);
  coqueiro(g, 2.0, 13.4, 5.2);
  [[1.6, 6.3], [4.8, 6.3], [1.6, 12.2], [4.8, 12.2], [13.0, 20.0], [13.0, 23.4]].forEach(([x, z]) => arbusto(g, x, z, .6));
})();

/* ===================== GARAGEM E CORREDOR ===================== */
(function () {
  const g = G.lazer, r = EXT.garagem;
  /* faixa branca de demarcacao */
  caixa(g, .12, .02, r.z1 - r.z0 - .4, std({ color: '#ffffff', roughness: 1 }), 4.4, .08, (r.z0 + r.z1) / 2, false);
  carro(g, 6.2, r.z0 + 2.4, M.carro2);
  /* cobertura leve da garagem */
  [r.x0 + .3, r.x1 - .3].forEach(x => coluna(g, x, r.z1 - .3, 2.7, .22, M.paredeAmar));
  const c = caixa(G.cobertura, r.x1 - r.x0 + .8, .14, r.z1 - r.z0 + .7, M.laje,
    (r.x0 + r.x1) / 2, 2.7, (r.z0 + r.z1) / 2);
  TETOS.push(c);

  /* corredor lateral coberto, com o balanco */
  const k = EXT.corredor;
  [k.z0 + .4, k.z0 + 6.0, k.z0 + 12.0, k.z1 - .4].forEach(z => coluna(g, k.x1 - .22, z, 2.8, .22, M.paredeAmar));
  const c2 = caixa(G.cobertura, k.x1 - k.x0 + .5, .14, k.z1 - k.z0 + .5, M.laje,
    (k.x0 + k.x1) / 2, 2.8, (k.z0 + k.z1) / 2);
  TETOS.push(c2);
  /* balanco de crianca pendurado */
  const bx = (k.x0 + k.x1) / 2, bz = k.z0 + 4.4;
  caixa(g, .05, 1.5, .05, M.cama, bx - .3, 1.25, bz, false);
  caixa(g, .05, 1.5, .05, M.cama, bx + .3, 1.25, bz, false);
  caixa(g, .8, .09, .36, M.madeira, bx, 1.2, bz);
  /* bicicleta e caixa de brinquedos, so volumes */
  caixa(g, .5, .5, .9, std({ color: '#d8a33a', roughness: .8 }), bx, .1, k.z1 - 2.0);
})();

/* ===================== RÓTULOS ===================== */
const rotulos = [];
function rotulo(r, grupo, y) {
  const el = document.createElement('div');
  el.className = 'rot';
  el.innerHTML = '<b>' + r.n + '</b>';
  const o = new CSS2DObject(el);
  o.position.set((r.x0 + r.x1) / 2 - CX, y, (r.z0 + r.z1) / 2 - CZ);
  scene.add(o);
  rotulos.push({ o, el, piso: grupo });
  return o;
}
Object.values(T).forEach(r => rotulo(r, 'casa', 1.9));
Object.values(EXT).filter(r => r !== EXT.deck).forEach(r => rotulo(r, 'ext', 1.2));

/* ===================== CÂMERA E ESTADO ===================== */
const ALVO = EMBED ? new THREE.Vector3(0, 1.6, 0) : new THREE.Vector3(0, 1.0, 0);
/* o lote tem 15 m de largura por 27 m de fundo. a tela do celular e estreita,
   entao o campo de visao horizontal fica pequeno e a camera precisa recuar:
   a distancia e calculada pelo que precisa caber em cada eixo, nao chutada */
const MEIA_V = 21 * Math.PI / 180;
function meiaH() { return Math.atan(Math.tan(MEIA_V) * Math.max(innerWidth / innerHeight, .35)); }
function distVista() { return Math.max(15.5 / Math.tan(meiaH()), 12.5 / Math.tan(MEIA_V)); }
const DIR_VISTA = new THREE.Vector3(24, 23, 30).normalize();
const DIST = distVista();
const FATOR = DIST / 34;
const VISTA_INICIAL = DIR_VISTA.clone().multiplyScalar(DIST);

function irPara(pos, alvo, ms = 900) {
  const p0 = camera.position.clone(), a0 = controls.target.clone();
  const t0 = performance.now();
  (function anima() {
    const k = Math.min(1, (performance.now() - t0) / ms);
    const e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(p0, pos, e);
    controls.target.lerpVectors(a0, alvo, e);
    controls.update();
    if (k < 1) requestAnimationFrame(anima);
  })();
}
function reset() { irPara(VISTA_INICIAL.clone(), ALVO.clone()); }
camera.position.copy(VISTA_INICIAL);
controls.target.copy(ALVO);
controls.update();

let aberto = false, foco = 'tudo', emPlanta = false;

function aplicar() {
  G.casa.visible = G.mob.visible = foco !== 'lazer';
  G.lazer.visible = foco !== 'casa';
  G.cobertura.visible = !aberto && foco !== 'lazer';
  TETOS.forEach(t => { t.visible = !aberto; });
  rotulos.forEach(r => {
    let ok = false;
    /* no celular a tela e pequena: os rotulos dos comodos so aparecem
       quando a pessoa entra em "Quartos", senao embolam todos juntos */
    if (r.piso === 'casa') ok = aberto && foco !== 'lazer' && (!MOBILE || foco === 'casa');
    if (r.piso === 'ext') ok = foco !== 'casa';
    r.el.classList.toggle('off', !ok);
  });
}
aplicar();

/* ===================== CONTROLES ===================== */
function seg(id, attr, fn) {
  const box = document.getElementById(id);
  box.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...box.children].forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    fn(b.getAttribute(attr));
  });
}
seg('segCorte', 'data-n', v => { aberto = v === 'aberto'; aplicar(); });
seg('segFoco', 'data-f', v => {
  foco = v;
  if (v === 'casa') {
    aberto = true;
    document.querySelectorAll('#segCorte button').forEach(b => b.classList.toggle('on', b.dataset.n === 'aberto'));
    aplicar();
    irPara(new THREE.Vector3(10, 20, 14).multiplyScalar(FATOR), new THREE.Vector3(-3.3, 1.2, -.7));
  } else if (v === 'lazer') {
    aplicar();
    irPara(new THREE.Vector3(10, 13, 16).multiplyScalar(FATOR).add(new THREE.Vector3(4.6, 0, 8.4)), new THREE.Vector3(4.6, .4, 8.4));
  } else { aplicar(); reset(); }
});
document.getElementById('btnReset').addEventListener('click', () => {
  aberto = false; foco = 'tudo'; emPlanta = false;
  document.querySelectorAll('#segCorte button').forEach(b => b.classList.toggle('on', b.dataset.n === 'fechado'));
  document.querySelectorAll('#segFoco button').forEach(b => b.classList.toggle('on', b.dataset.f === 'tudo'));
  aplicar(); reset();
});
document.getElementById('btnVista').addEventListener('click', () => {
  emPlanta = !emPlanta;
  if (emPlanta) {
    aberto = true;
    document.querySelectorAll('#segCorte button').forEach(b => b.classList.toggle('on', b.dataset.n === 'aberto'));
    aplicar();
    irPara(new THREE.Vector3(0, Math.max(14.5 / Math.tan(MEIA_V), 8.6 / Math.tan(meiaH())), .01), new THREE.Vector3(0, 0, 0));
  } else {
    aberto = false;
    document.querySelectorAll('#segCorte button').forEach(b => b.classList.toggle('on', b.dataset.n === 'fechado'));
    aplicar(); reset();
  }
});
document.getElementById('fechaTitulo').addEventListener('click', () =>
  document.getElementById('titulo').classList.add('fechado'));

/* lista de ambientes */
const ambBox = document.getElementById('amb');
const GRUPOS = [
  ['Dentro da casa', [T.sala, T.cozinha, T.quarto1, T.quarto2, T.wc], 'casa'],
  ['Área externa', [EXT.varanda, EXT.piscina, EXT.deck, EXT.gourmet, EXT.garagem, EXT.corredor], 'ext']
];
let botaoAtivo = null;
GRUPOS.forEach(([titulo, itens, tipo]) => {
  const h = document.createElement('h4'); h.textContent = titulo; ambBox.appendChild(h);
  itens.forEach(r => {
    const b = document.createElement('button');
    b.innerHTML = '<span>' + r.n + '</span>';
    b.addEventListener('click', () => {
      if (botaoAtivo) botaoAtivo.classList.remove('on');
      b.classList.add('on'); botaoAtivo = b;
      aberto = true;
      document.querySelectorAll('#segCorte button').forEach(x => x.classList.toggle('on', x.dataset.n === 'aberto'));
      foco = 'tudo';
      document.querySelectorAll('#segFoco button').forEach(x => x.classList.toggle('on', x.dataset.f === 'tudo'));
      aplicar();
      const cx = (r.x0 + r.x1) / 2 - CX, cz = (r.z0 + r.z1) / 2 - CZ;
      const maior = Math.max(r.x1 - r.x0, r.z1 - r.z0);
      const raio = Math.max(13, maior * 2.5) * FATOR;
      irPara(new THREE.Vector3(cx + raio * .62, .8 + raio * .85, cz + raio * .62),
             new THREE.Vector3(cx, .8, cz));
    });
    ambBox.appendChild(b);
  });
});

/* ===================== LOOP ===================== */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
}, { passive: true });

let primeiroQuadro = true;
(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  if (primeiroQuadro) {
    primeiroQuadro = false;
    setTimeout(() => document.getElementById('carregando').classList.add('off'), 280);
  }
})();

setTimeout(() => document.getElementById('dica').classList.add('off'), 5400);
setTimeout(() => document.getElementById('titulo').classList.add('fechado'), MOBILE ? 6800 : 9500);
</script>
