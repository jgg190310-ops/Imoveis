<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Planta 3D — Casas de Temporada em Prado</title>
<meta name="description" content="Planta 3D interativa das quatro casas de temporada do Augusto em Prado, Bahia: quartos, suítes, piscina, varanda e área gourmet. Gire, tire o telhado e entre.">
<meta name="theme-color" content="#0b2b33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%230b2b33'/%3E%3Cg fill='none' stroke='%23e8b55e' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M8 30h32'/%3E%3Cpath d='M12 30V19l12-8 12 8v11'/%3E%3Cpath d='M8 36c3 0 3-2 6-2s3 2 6 2 3-2 6-2 3 2 6 2 3-2 6-2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#edf1f0; --deep:#071519; --deeper:#040f12;
  --cyan:#36b9cf; --cyan-d:#5cc8da;
  --paper:#f3f2ee; --panel:#e8e6df;
  --sans:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;
  --serif:'Newsreader',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b181c;
  font:300 15px/1.6 var(--serif);color:var(--ink);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:var(--sans);color:inherit;cursor:pointer;border:0;background:none}
#cena{position:fixed;inset:0;touch-action:none}
#cena canvas{display:block}
#rotulos{position:fixed;inset:0;pointer-events:none;z-index:5}

/* ---------- barra de vidro ---------- */
.topo{position:fixed;z-index:30;top:max(12px,env(safe-area-inset-top));left:50%;
  transform:translateX(-50%);display:flex;align-items:center;gap:14px;
  padding:6px 6px 6px 16px;border-radius:999px;
  background:rgba(10,31,37,.52);backdrop-filter:blur(16px) saturate(1.3);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid rgba(255,255,255,.2);color:#fff;white-space:nowrap;
  box-shadow:0 14px 44px -20px rgba(0,0,0,.65);max-width:calc(100vw - 20px)}
.topo .marca{font:500 12.5px var(--sans);letter-spacing:.17em;text-transform:uppercase;
  display:flex;align-items:center;gap:9px;overflow:hidden;text-overflow:ellipsis}
.topo .marca svg{width:22px;height:22px;flex:none;opacity:.95}
.topo a{color:var(--deep);text-decoration:none;font:500 12.5px var(--sans);
  padding:9px 16px;border-radius:999px;background:#fff;transition:background .2s,transform .2s}
.topo a:hover{background:var(--cyan);color:#fff}

/* ---------- cartão de título ---------- */
.titulo{position:fixed;z-index:15;left:max(18px,env(safe-area-inset-left));top:82px;max-width:330px;
  padding:20px 22px;border-radius:18px;background:rgba(11,24,28,.78);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(237,241,240,.14);box-shadow:0 22px 54px -32px rgba(6,22,26,.7);
  transition:opacity .35s,transform .35s}
.titulo.fechado{opacity:0;transform:translateY(-10px);pointer-events:none}
.titulo small{display:block;font:500 10px var(--sans);letter-spacing:.3em;
  text-transform:uppercase;color:var(--cyan-d);margin-bottom:9px}
.titulo h1{font:300 31px/1.06 var(--sans);letter-spacing:-.03em}
.titulo p{font-size:14px;line-height:1.6;color:#b9cace;margin-top:10px}
.titulo .fecha{position:absolute;top:8px;right:10px;width:28px;height:28px;border-radius:50%;
  font-size:19px;line-height:1;color:#9fb3b8;display:none}

/* ---------- lista de ambientes ---------- */
.amb{position:fixed;z-index:15;right:max(18px,env(safe-area-inset-right));top:82px;width:228px;
  max-height:calc(100svh - 190px);overflow:auto;padding:14px;border-radius:18px;
  background:rgba(11,24,28,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(237,241,240,.14);box-shadow:0 22px 54px -32px rgba(6,22,26,.7);
  scrollbar-width:thin;transition:opacity .3s,transform .3s}
.amb h2{font:500 10px var(--sans);letter-spacing:.28em;text-transform:uppercase;
  color:var(--cyan-d);margin:2px 4px 10px}
.amb .grupo{font:500 9.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;
  color:#9fb3b8;margin:13px 6px 4px}
.amb button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;
  text-align:left;padding:8px 10px;border-radius:10px;font:400 14px var(--serif);
  transition:background .18s}
.amb button:hover,.amb button.ativo{background:rgba(47,169,189,.15)}
.amb button span{display:block;font-size:11.5px;color:#93a8ae;font-family:var(--serif)}
.amb button i{width:6px;height:6px;border-radius:50%;background:var(--cyan);flex:none;opacity:0;transition:opacity .2s}
.amb button.ativo i{opacity:1}

/* ---------- controles ---------- */
.ctrl{position:fixed;z-index:20;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
  transform:translateX(-50%);display:flex;gap:7px;align-items:center;padding:6px;
  border-radius:999px;background:rgba(10,31,37,.68);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.17);
  box-shadow:0 16px 44px -18px rgba(0,0,0,.7);white-space:nowrap;max-width:calc(100vw - 16px)}
.seg{display:flex;background:rgba(255,255,255,.09);border-radius:999px;padding:3px}
.seg button{color:#e4eef0;font:500 12.5px var(--sans);padding:9px 14px;border-radius:999px;
  transition:background .2s,color .2s}
.seg button.on{background:var(--paper);color:var(--deep)}
.ctrl .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:rgba(255,255,255,.09);transition:background .2s;flex:none}
.ctrl .ic:hover{background:rgba(255,255,255,.2)}
.ctrl .ic svg{width:19px;height:19px}

/* ---------- rótulos 3D ---------- */
.rot{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:7px;
  padding:6px 12px 6px 8px;border-radius:999px;background:rgba(11,24,28,.88);
  color:var(--ink);border:1px solid rgba(237,241,240,.16);
  box-shadow:0 7px 22px -9px rgba(6,22,26,.6);font:500 12px/1.15 var(--sans);
  white-space:nowrap;user-select:none;transition:opacity .25s,transform .2s,background .2s}
.rot:hover{transform:scale(1.06);background:rgba(18,36,41,.96)}
.rot i{width:7px;height:7px;border-radius:50%;background:var(--cyan);flex:none}
.rot.suite i{background:#d08a3c}
.rot small{display:block;font:400 10.5px var(--serif);color:#9fb3b8;margin-top:1px}
.rot.compacto small{display:none}
.rot.oculto{opacity:0;pointer-events:none}

/* ---------- dica + carregando ---------- */
.dica{position:fixed;z-index:14;left:50%;bottom:78px;transform:translateX(-50%);
  font:400 12.5px var(--serif);color:#fff;background:rgba(10,31,37,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:7px 15px;border-radius:999px;transition:opacity .6s;white-space:nowrap}
.dica.fora{opacity:0;pointer-events:none}
#carregando{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:var(--deep);color:#dfe9ec;transition:opacity .5s}
#carregando.fora{opacity:0;pointer-events:none}
#carregando div{text-align:center}
#carregando b{display:block;font:500 13px var(--sans);letter-spacing:.3em;
  text-transform:uppercase;margin-bottom:14px}
#carregando i{display:block;width:120px;height:2px;background:rgba(255,255,255,.18);
  border-radius:2px;overflow:hidden;margin:0 auto}
#carregando i::after{content:"";display:block;height:100%;width:40%;background:var(--cyan);
  animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}

.nota{position:fixed;z-index:12;left:max(18px,env(safe-area-inset-left));bottom:22px;
  font-size:11.5px;color:#c3d3d7;max-width:252px;line-height:1.45;
  background:rgba(11,24,28,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(237,241,240,.12);padding:9px 13px;border-radius:13px}
body.noite .nota{color:#dfe9ec;background:rgba(10,31,37,.5);border-color:rgba(255,255,255,.13)}
@media (max-height:620px){.nota{display:none}}

/* ---------- celular ---------- */
@media (max-width:900px){
  .titulo{top:70px;left:12px;right:12px;max-width:none;padding:16px 18px}
  .titulo h1{font-size:25px}
  .titulo p{font-size:13px}
  .titulo .fecha{display:grid;place-items:center}
  .amb{top:auto;bottom:74px;left:12px;right:12px;width:auto;max-height:38svh;
    display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:7px;
    padding:10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .amb h2,.amb .grupo{display:none}
  .amb button{width:auto;flex:none;scroll-snap-align:start;
    background:rgba(255,255,255,.72);padding:8px 13px;font-size:13px}
  .amb button span{font-size:10.5px}
  .amb.escondido{opacity:0;pointer-events:none;transform:translateY(12px)}
  .ctrl{gap:5px;padding:5px}
  .seg button{padding:8px 11px;font-size:11.5px}
  .ctrl .ic{width:36px;height:36px}
  .dica{bottom:auto;top:calc(100svh - 190px);font-size:11.5px}
  .nota{display:none}
  .rot{font-size:11px;padding:5px 10px 5px 7px}
  .rot small{display:none}
}
@media (max-width:380px){
  .seg button{padding:8px 9px;font-size:11px}
}

/* ---------- abas das casas ---------- */
.abas{position:fixed;z-index:25;top:calc(max(12px,env(safe-area-inset-top)) + 56px);left:50%;transform:translateX(-50%);
  display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(10,31,37,.62);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);
  max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none;box-shadow:0 14px 40px -22px rgba(0,0,0,.6)}
.abas::-webkit-scrollbar{display:none}
.abas button{color:#e4eef0;font:500 12.5px var(--sans);padding:8px 14px;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s}
.abas button.on{background:#f0cd82;color:#14272b}
.titulo,.amb{top:126px}
.amb{max-height:calc(100svh - 236px)}
.rot.suite i{background:#f0b45e}
@media (max-width:900px){
  .abas{top:calc(max(12px,env(safe-area-inset-top)) + 52px);left:8px;right:8px;transform:none;max-width:none}
  .abas button{font-size:11.5px;padding:7px 11px}
  .titulo{top:112px}
  .amb{top:auto}
  .amb button{background:rgba(255,255,255,.12)!important;color:#edf1f0}
  .amb button span{color:#b9cace}
}

</style>
</head>
<body>

<div id="cena"></div>
<div id="rotulos"></div>

<header class="topo">
  <span class="marca">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M8 30h32"/><path d="M12 30V19l12-8 12 8v11"/><path d="M8 37c3 0 3-2 6-2s3 2 6 2 3-2 6-2 3 2 6 2 3-2 6-2"/></svg>
    Casas em Prado
  </span>
  <a href="../">Voltar ao site</a>
</header>

<nav class="abas" id="abas" aria-label="Escolha a casa"></nav>

<div class="titulo" id="titulo">
  <button class="fecha" id="fechaTitulo" aria-label="Fechar">×</button>
  <small id="tSmall"></small>
  <h1 id="tH1"></h1>
  <p id="tP"></p>
</div>

<nav class="amb" id="amb"></nav>

<div class="dica" id="dica">Arraste para girar · dois dedos para mover</div>

<div class="ctrl">
  <div class="seg" id="segTelhado">
    <button data-n="todos" class="on">Com telhado</button>
    <button data-n="aberto">Por dentro</button>
  </div>
  <div class="seg" id="segVista">
    <button data-v="3d" class="on">3D</button>
    <button data-v="planta">Planta</button>
  </div>
  <button class="ic" id="btnNoite" aria-label="Dia ou noite"></button>
  <button class="ic" id="btnReset" aria-label="Recomeçar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/></svg>
  </button>
</div>

<p class="nota" id="nota"></p>

<div id="carregando"><div><b>Casas em Prado</b><i></i></div></div>

<script type="module">
import * as THREE from './vendor/three.module.min.js';
import { OrbitControls } from './vendor/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from './vendor/CSS2DRenderer.js';
/* ======================= BASE ======================= */
const host = document.getElementById('cena');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const MOBILE = innerWidth < 900 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
host.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer({ element: document.getElementById('rotulos') });
labelRenderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const CEU_DIA = new THREE.Color('#0b181c'), CEU_NOITE = new THREE.Color('#081520');
scene.background = CEU_DIA.clone();
scene.fog = new THREE.Fog(CEU_DIA.clone(), 95, 230);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minDistance = 4; controls.maxDistance = 80;
controls.maxPolarAngle = Math.PI * .475;
controls.screenSpacePanning = true;

const hemi = new THREE.HemisphereLight('#eaf5ff', '#59684a', 1.15); scene.add(hemi);
const sol = new THREE.DirectionalLight('#fff3df', 2.5);
sol.position.set(14, 26, 20); sol.castShadow = true;
sol.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
Object.assign(sol.shadow.camera, { left: -26, right: 26, top: 24, bottom: -24, near: 1, far: 90 });
sol.shadow.bias = -.0004; sol.shadow.normalBias = .03;
scene.add(sol);
const luzesNoite = [];

/* ======================= TEXTURAS ======================= */
function tx(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);
function ruido(g, w, h, n, cores, tam = [1, 3]) {
  for (let i = 0; i < n; i++) { g.fillStyle = cores[(Math.random() * cores.length) | 0]; const s = rnd(tam[0], tam[1]); g.fillRect(Math.random() * w, Math.random() * h, s, s); }
}
const T = {
  grama: (r = 16) => tx(256, 256, (g, w, h) => { g.fillStyle = '#6d9141'; g.fillRect(0, 0, w, h); ruido(g, w, h, 5200, ['#5d8038', '#7b9f4e', '#668b3e', '#87a55b', '#547539'], [1, 3]); }, r, r),
  brita: (rx = 18, ry = 2) => tx(256, 256, (g, w, h) => { g.fillStyle = '#b8b2a6'; g.fillRect(0, 0, w, h); ruido(g, w, h, 4200, ['#a8a295', '#c7c1b5', '#948e82', '#d4cec2', '#8d877c'], [2, 5]); }, rx, ry),
  deck: (rx = 9, ry = 2) => tx(256, 256, (g, w, h) => {
    const cs = ['#5a3722', '#64402a', '#512f1d', '#6b4630'];
    for (let y = 0; y < h; y += 26) {
      g.fillStyle = cs[((y / 26) | 0) % cs.length]; g.fillRect(0, y, w, 26);
      for (let i = 0; i < 26; i++) { g.strokeStyle = 'rgba(28,14,6,.2)'; g.lineWidth = 1; const yy = y + rnd(2, 24); g.beginPath(); g.moveTo(0, yy); g.bezierCurveTo(w * .3, yy + rnd(-1.5, 1.5), w * .6, yy + rnd(-1.5, 1.5), w, yy); g.stroke(); }
      g.fillStyle = 'rgba(18,8,2,.6)'; g.fillRect(0, y, w, 2);
    }
  }, rx, ry),
  reboco: (r = 3) => tx(256, 256, (g, w, h) => { g.fillStyle = '#f3f0e7'; g.fillRect(0, 0, w, h); ruido(g, w, h, 2600, ['#ece8dd', '#f8f6ef', '#e3dfd3'], [1, 2.5]); }, r, r),
  telha: (rx = 16, ry = 5) => tx(256, 256, (g, w, h) => {
    g.fillStyle = '#8e8d86'; g.fillRect(0, 0, w, h);
    const tw = 30, th = 40;
    for (let y = 0, r = 0; y < h + th; y += th - 9, r++) for (let x = (r % 2 ? -15 : 0); x < w; x += tw) {
      const grd = g.createLinearGradient(x, 0, x + tw, 0);
      grd.addColorStop(0, '#75746d'); grd.addColorStop(.5, ['#a9a79e', '#9b9a92', '#b3b1a7'][(Math.random() * 3) | 0]); grd.addColorStop(1, '#6b6a63');
      g.fillStyle = grd; g.beginPath(); g.roundRect(x + 1, y, tw - 2, th, [0, 0, 12, 12]); g.fill();
    }
    ruido(g, w, h, 900, ['rgba(60,70,50,.16)', 'rgba(255,255,255,.08)'], [2, 7]);
  }, rx, ry),
  granito: (r = 1) => tx(128, 128, (g, w, h) => { g.fillStyle = '#1b1b1d'; g.fillRect(0, 0, w, h); ruido(g, w, h, 1500, ['#38383b', '#53504c', '#0e0e0f', '#67615a'], [1, 2]); }, r, r),
  piso: (r = 5) => tx(256, 256, (g, w, h) => {
    const cs = ['#c89a68', '#bd8e5d', '#d0a473', '#b88a5c'];
    for (let y = 0; y < h; y += 42) { g.fillStyle = cs[((y / 42) | 0) % cs.length]; g.fillRect(0, y, w, 42);
      for (let i = 0; i < 22; i++) { g.strokeStyle = 'rgba(110,70,35,.17)'; g.lineWidth = 1; const yy = y + rnd(3, 39); g.beginPath(); g.moveTo(0, yy); g.bezierCurveTo(w * .35, yy + rnd(-2, 2), w * .65, yy + rnd(-2, 2), w, yy); g.stroke(); }
      g.fillStyle = 'rgba(90,55,25,.4)'; g.fillRect(0, y, w, 1.4); }
  }, r, r),
  azulejoBan: (r = 5) => tx(128, 128, (g, w, h) => { g.fillStyle = '#eef0ee'; g.fillRect(0, 0, w, h); g.strokeStyle = '#d2d6d4'; g.lineWidth = 2; for (let i = 0; i <= w; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); } }, r, r),
  // ladrilho hidráulico colorido do backsplash (igual ao das fotos)
  ladrilho: (rx = 5, ry = 1.4) => tx(256, 256, (g, w, h) => {
    const s = 64;
    const paletas = [['#e9e3d4', '#2f7f98', '#c76a3f'], ['#e9e3d4', '#3f8f7a', '#2f5f84'], ['#efe9db', '#c76a3f', '#2f7f98'], ['#e4ded0', '#2f5f84', '#3f8f7a']];
    for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s) {
      const p = paletas[(Math.random() * paletas.length) | 0];
      g.fillStyle = p[0]; g.fillRect(x, y, s, s);
      g.save(); g.translate(x + s / 2, y + s / 2);
      g.fillStyle = p[1];
      for (let k = 0; k < 4; k++) { g.save(); g.rotate(k * Math.PI / 2); g.beginPath(); g.moveTo(0, -6); g.lineTo(13, -20); g.lineTo(0, -29); g.lineTo(-13, -20); g.closePath(); g.fill(); g.restore(); }
      g.fillStyle = p[2]; g.beginPath(); g.arc(0, 0, 6.5, 0, 7); g.fill();
      g.strokeStyle = p[1]; g.lineWidth = 2.4; g.beginPath(); g.arc(0, 0, 24, 0, 7); g.stroke();
      g.restore();
      [[0, 0], [s, 0], [0, s], [s, s]].forEach(([a, b]) => { g.fillStyle = p[2]; g.beginPath(); g.arc(x + a, y + b, 7, 0, 7); g.fill(); });
      g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 2; g.strokeRect(x, y, s, s);
    }
  }, rx, ry),
  veneziana: (rx = 1, ry = 1) => tx(64, 128, (g, w, h) => {
    g.fillStyle = '#4e2e1a'; g.fillRect(0, 0, w, h);

function caixa(w, h, d, mat, x, y, z, pai = G.externo, sombra = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h / 2, z); m.castShadow = sombra; m.receiveShadow = true; pai.add(m); return m;
}
function cil(rt, rb, h, mat, x, y, z, pai = G.externo, seg = 16) {

}
const janelas = [], telas = [];

// parede com aberturas: {c: centro absoluto ao longo do eixo, w, b, t, tipo:'porta'|'janela'|'vao', abre}
function parede(eixo, fixo, de, ate, y0, alt, esp, mat, aberturas = [], pai = G.bloco) {
  const L = ate - de;
  const ops = aberturas.map(o => ({ ...o, a: o.c - o.w / 2 - de, z: o.c + o.w / 2 - de })).sort((p, q) => p.a - q.a);
  const peca = (s0, s1, b, t) => {
    if (s1 - s0 < .01 || t - b < .01) return;
    const len = s1 - s0, mid = de + (s0 + s1) / 2;
    if (eixo === 'x') caixa(len, t - b, esp, mat, mid, y0 + b, fixo, pai);
    else caixa(esp, t - b, len, mat, fixo, y0 + b, mid, pai);
  };
  let cur = 0;
  for (const o of ops) {
    peca(cur, o.a, 0, alt);
    peca(o.a, o.z, o.t, alt);
    if (o.b > 0) peca(o.a, o.z, 0, o.b);
    cur = o.z;
    const mid = de + (o.a + o.z) / 2, w = o.z - o.a;
    const pos = (dx, dy, dz, sx, sy, sz, m, som = false) => eixo === 'x'
      ? caixa(sx, sy, sz, m, mid + dx, y0 + dy, fixo + dz, pai, som)
      : caixa(sz, sy, sx, m, fixo + dz, y0 + dy, mid + dx, pai, som);
    if (o.tipo === 'janela') {
      const v = pos(0, o.b, 0, w - .08, o.t - o.b - .08, .02, MAT.janelaVidro); janelas.push(v);
      pos(0, o.b - .05, 0, w + .12, .06, esp + .1, MAT.branco);                 // peitoril
      pos(0, o.t - .06, 0, w, .06, esp + .04, MAT.madeiraEsc);
      pos(-w / 2 + .03, o.b, 0, .06, o.t - o.b, esp + .04, MAT.madeiraEsc);
      pos(w / 2 - .03, o.b, 0, .06, o.t - o.b, esp + .04, MAT.madeiraEsc);
      pos(0, o.b, 0, .05, o.t - o.b, esp + .02, MAT.madeiraEsc);
      if (o.folhas) {                                                            // venezianas abertas na fachada
        const lf = (w - .1) / 2, hf = o.t - o.b - .06;
        [-1, 1].forEach(s => {
          const g = new THREE.Group();
          const f = new THREE.Mesh(new THREE.BoxGeometry(lf, hf, .035), MAT.veneziana);
          f.position.set(s * lf / 2, 0, 0); f.castShadow = true; g.add(f);
          g.position.set(eixo === 'x' ? mid + s * w / 2 : fixo + esp / 2 + .03,
            y0 + o.b + hf / 2,
            eixo === 'x' ? fixo + esp / 2 + .03 : mid + s * w / 2);
          g.rotation.y = eixo === 'x' ? s * -.28 : (s * -.28) - Math.PI / 2;
          pai.add(g);
        });
      }
    } else if (o.tipo === 'porta') {
      const g = new THREE.Group();
      const folha = new THREE.Mesh(new THREE.BoxGeometry(w - .06, o.t - .04, .045), MAT.madeiraEsc);
      folha.position.set((w - .06) / 2, (o.t - .04) / 2, 0); folha.castShadow = true; g.add(folha);
      // almofadas da porta
      [[.0, .55], [.0, 1.45]].forEach(([px, py]) => {
        const al = new THREE.Mesh(new THREE.BoxGeometry((w - .06) * .62, .62, .012), MAT.madeiraMed);
        al.position.set((w - .06) / 2 + px, py, .03); g.add(al);
      });
      const mac = new THREE.Mesh(new THREE.SphereGeometry(.028, 10, 10), MAT.inox);
      mac.position.set(w - .17, 1.02, .05); g.add(mac);
      // batente
      const ab = o.abre ?? -1.15;
      if (eixo === 'x') { g.position.set(mid - w / 2 + .03, y0, fixo); g.rotation.y = ab; }
      else { g.position.set(fixo, y0, mid - w / 2 + .03); g.rotation.y = -Math.PI / 2 + ab; }
      pai.add(g);
      pos(0, 0, 0, w + .14, .07, esp + .06, MAT.madeiraEsc);
      pos(0, o.t, 0, w + .14, .07, esp + .06, MAT.madeiraEsc);
      pos(-w / 2 - .035, 0, 0, .07, o.t, esp + .06, MAT.madeiraEsc);
      pos(w / 2 + .035, 0, 0, .07, o.t, esp + .06, MAT.madeiraEsc);
    }
  }
  peca(cur, L, 0, alt);
}
function piso(x1, x2, z1, z2, y, mat, pai, esp = .06) {
  const m = caixa(x2 - x1, esp, z2 - z1, mat, (x1 + x2) / 2, y - esp, (z1 + z2) / 2, pai, false);
  m.receiveShadow = true; return m;
}

/* ======================= TROCA DE CASA ======================= */
controls.maxDistance = 120;
scene.fog.near = 95; scene.fog.far = 230;
Object.assign(sol.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 1, far: 120 });
sol.position.set(18, 34, 26); sol.shadow.camera.updateProjectionMatrix();

let DEF = CASAS[0], AMB = [];
const rotulos = [];
function limpar() {
  [G.externo, G.bloco, G.fachada, G.telhado].forEach(g => {
    while (g.children.length) { const o = g.children[g.children.length - 1]; g.remove(o); o.traverse(n => { if (n.geometry) n.geometry.dispose(); }); }
  });
  luzesNoite.length = 0; janelas.length = 0; telas.length = 0;
  rotulos.forEach(r => { scene.remove(r.o); r.o.element.remove(); }); rotulos.length = 0;
}
function otimiza() {
  const tam = new THREE.Vector3();
  [G.externo, G.bloco, G.fachada, G.telhado].forEach(raiz => raiz.traverse(o => {
    if (o.isMesh && o.castShadow) {
      if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
      o.geometry.boundingBox.getSize(tam);
      const maior = Math.max(tam.x * o.scale.x, tam.y * o.scale.y, tam.z * o.scale.z);
      if (maior < (MOBILE ? 1.2 : .7)) o.castShadow = false;
    }
    o.updateMatrix(); o.matrixAutoUpdate = false;
  }));
  scene.updateMatrixWorld(true);
}
function montaRotulos() {
  AMB = DEF.rotulos;
  AMB.forEach(a => {
    const el = document.createElement('div');
    el.className = 'rot' + (a.tipo === 'int' ? ' suite' : '');
    el.innerHTML = `<i></i><div>${a.nome}${a.sub ? `<small>${a.sub}</small>` : ''}</div>`;
    el.addEventListener('pointerdown', e => e.stopPropagation());
    el.addEventListener('click', e => { e.stopPropagation(); focar(a); });
    const o = new CSS2DObject(el); o.position.set(...a.pos); scene.add(o);
    rotulos.push({ a, o });
  });
  const amb = document.getElementById('amb'); amb.innerHTML = '';
  DEF.listas.forEach(([t, ids]) => {
    const h = document.createElement('div'); h.className = 'grupo'; h.textContent = t; amb.appendChild(h);
    ids.forEach(id => {
      const a = AMB.find(x => x.id === id); if (!a) return;
      const b = document.createElement('button'); b.dataset.id = id;
      b.innerHTML = `<div>${a.nome}<span>${a.sub || ''}</span></div><i></i>`;
      b.addEventListener('click', () => focar(a));
      amb.appendChild(b);
    });
  });
}
function selecionar(i, primeira) {
  DEF = CASAS[i];
  document.querySelectorAll('#abas button').forEach((b, k) => b.classList.toggle('on', k === i));
  limpar();
  montaCasa(DEF);
  otimiza();
  montaRotulos();
  const [sm, h1, p] = DEF.titulo;
  document.getElementById('tSmall').textContent = sm; document.getElementById('tH1').textContent = h1; document.getElementById('tP').textContent = p;
  document.getElementById('nota').textContent = DEF.nota;
  document.getElementById('titulo').classList.remove('fechado');
  if (location.hash.slice(1) !== DEF.id) history.replaceState(null, '', '#' + DEF.id);
  modo = 'todos'; aplicaModo(); aplicaNoite();
  if (vista === 'planta') setVista('planta'); else if (!primeira) voa(posInicio(), alvoInicio(), 1.2);
}
const abas = document.getElementById('abas');
CASAS.forEach((c, i) => { const b = document.createElement('button'); b.textContent = c.aba; b.addEventListener('click', () => { parouAuto(); selecionar(i); }); abas.appendChild(b); });

/* ======================= TELHADO / VISTA ======================= */
let modo = 'todos', vista = '3d';
function aplicaModo() {
  G.telhado.visible = G.fachada.visible = modo === 'todos';
  rotulos.forEach(({ a, o }) => { o.visible = a.tipo === 'int' ? modo === 'aberto' : true; });
  document.querySelectorAll('#segTelhado button').forEach(b => b.classList.toggle('on', b.dataset.n === modo));
}

/* ======================= CAMERA ======================= */
const telaEstreita = () => innerWidth / innerHeight < .9;
const V = a => new THREE.Vector3(...a);
const INICIO_ATUAL = () => { const c = telaEstreita() ? DEF.cam.estreito : DEF.cam.largo; return { pos: V(c.pos), alvo: V(c.alvo) }; };
const alvoInicio = () => INICIO_ATUAL().alvo.clone();
function fatorTela() { const a = innerWidth / innerHeight; return a < .75 ? 1.5 : a < 1.1 ? 1.3 : a < 1.4 ? 1.1 : 1; }
function tamTela() { return Math.max(1, fatorTela() * .82); }
function posInicio() { const i = INICIO_ATUAL(); const f = telaEstreita() ? 1.45 : fatorTela(); return i.alvo.clone().add(i.pos.clone().sub(i.alvo).multiplyScalar(f)); }
let anim = null;
function voa(pos, alvo, dur = 1.1, depois) { anim = { p0: camera.position.clone(), p1: pos.clone(), a0: controls.target.clone(), a1: alvo.clone(), t0: performance.now(), dur, depois }; }
function focar(a) {
  if (!a) return;
  if (a.tipo === 'int' && modo !== 'aberto') { modo = 'aberto'; aplicaModo(); }
  document.querySelectorAll('#amb button').forEach(b => b.classList.toggle('ativo', b.dataset.id === a.id));
  const alvo = new THREE.Vector3(...a.pos); alvo.y -= .7;
  let pos;
  if (vista === 'planta') pos = alvo.clone().add(new THREE.Vector3(0, 22 * tamTela(), .04));
  else {
    let dir;
    if (a.tipo === 'int') dir = new THREE.Vector3(.3, 0, 1).normalize();
    else { dir = camera.position.clone().sub(controls.target); dir.y = 0; if (dir.lengthSq() < .001) dir.set(0, 0, 1); dir.normalize(); }
    const d = a.d * tamTela();
    pos = alvo.clone().add(dir.multiplyScalar(d)); pos.y = alvo.y + d * (a.tipo === 'int' ? .7 : .72);
  }
  parouAuto(); voa(pos, alvo, 1.0);
}
function resetar() {
  modo = 'todos'; aplicaModo(); setVista('3d', false);
  voa(posInicio(), alvoInicio(), 1.2);
  document.querySelectorAll('#amb button').forEach(b => b.classList.remove('ativo'));
}
function setVista(v, mover = true) {
  vista = v;
  document.querySelectorAll('#segVista button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'planta') {
    if (modo !== 'aberto') { modo = 'aberto'; aplicaModo(); }
    controls.enableRotate = false; controls.minPolarAngle = 0; controls.maxPolarAngle = .001;
    camera.fov = 30; camera.updateProjectionMatrix(); controls.maxDistance = 140;
    const [px, pz, h] = DEF.cam.planta;
    if (mover) voa(new THREE.Vector3(px, h * (telaEstreita() ? 1.9 : fatorTela()), pz + .05), new THREE.Vector3(px, .3, pz), 1.1);
  } else {
    controls.enableRotate = true; controls.minPolarAngle = 0; controls.maxPolarAngle = Math.PI * .475;
    camera.fov = 42; camera.updateProjectionMatrix(); controls.maxDistance = 120;
    if (mover) voa(posInicio(), alvoInicio(), 1.1);
  }
}

/* ======================= DIA / NOITE ======================= */
let noite = false;
const SOL_ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
const LUA_ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function aplicaNoite() {
  document.body.classList.toggle('noite', noite);
  scene.background.copy(noite ? CEU_NOITE : CEU_DIA);
  scene.fog.color.copy(noite ? CEU_NOITE : CEU_DIA);
  hemi.intensity = noite ? .22 : 1.15; hemi.color.set(noite ? '#6f86b8' : '#eaf5ff');
  sol.intensity = noite ? .32 : 2.5; sol.color.set(noite ? '#9fb6ff' : '#fff3df');
  luzesNoite.forEach(l => l.luz.intensity = noite ? l.max : 0);
  MAT.lampada.emissiveIntensity = noite ? 3.1 : .3;
  MAT.janelaVidro.emissiveIntensity = noite ? .85 : 0;
  MAT.janelaVidro.opacity = noite ? .72 : .42;
  MAT.tela.emissiveIntensity = noite ? .55 : 0;
  MAT2.agua.emissive = MAT2.agua.emissive || new THREE.Color(); MAT2.agua.emissive.set(noite ? '#0f6f8a' : '#000000');
  renderer.toneMappingExposure = noite ? 1.22 : 1.05;
  document.getElementById('btnNoite').innerHTML = noite ? SOL_ICO : LUA_ICO;
}

/* ======================= UI ======================= */
document.querySelectorAll('#segTelhado button').forEach(b => b.addEventListener('click', () => { modo = b.dataset.n; aplicaModo(); parouAuto(); }));
document.querySelectorAll('#segVista button').forEach(b => b.addEventListener('click', () => { setVista(b.dataset.v); parouAuto(); }));
document.getElementById('btnNoite').addEventListener('click', () => { noite = !noite; aplicaNoite(); });
document.getElementById('btnReset').addEventListener('click', resetar);
document.getElementById('fechaTitulo').addEventListener('click', () => document.getElementById('titulo').classList.add('fechado'));

let auto = true;
function parouAuto() {
  if (!auto) return;
  auto = false; controls.autoRotate = false;
  document.getElementById('dica').classList.add('fora');
  if (innerWidth < 900) document.getElementById('titulo').classList.add('fechado');
}
controls.autoRotate = true; controls.autoRotateSpeed = .45;
renderer.domElement.addEventListener('pointerdown', parouAuto);
renderer.domElement.addEventListener('wheel', parouAuto, { passive: true });
setTimeout(() => document.getElementById('dica').classList.add('fora'), 5400);

/* ======================= ROTULOS SEM SOBREPOSICAO ======================= */
const _v = new THREE.Vector3();
function prio(a) { return a.tipo === 'int' ? 3 : 1; }
function organizaRotulos() {
  const vis = rotulos.filter(r => r.o.visible);
  vis.forEach(r => r.o.element.classList.toggle('compacto', camera.position.distanceTo(_v.set(...r.a.pos)) > 26));
  vis.sort((p, q) => prio(q.a) - prio(p.a) || AMB.indexOf(p.a) - AMB.indexOf(q.a));
  const ocup = [];
  document.querySelectorAll('.amb,.titulo:not(.fechado),.ctrl,.topo,.abas,.nota').forEach(el => {
    if (getComputedStyle(el).display === 'none') return;
    const r = el.getBoundingClientRect(); if (r.width) ocup.push(r);
  });
  vis.forEach(r => {
    const el = r.o.element, b = el.getBoundingClientRect();
    if (!b.width) return;
    const fora = b.left < 2 || b.right > innerWidth - 2 || b.top < 2 || b.bottom > innerHeight - 2;
    const bate = fora || ocup.some(o => !(b.right + 5 < o.left || b.left - 5 > o.right || b.bottom + 4 < o.top || b.top - 4 > o.bottom));
    el.classList.toggle('oculto', bate);
    if (!bate) ocup.push(b);
  });
}

/* ======================= LOOP ======================= */
const ini = Math.max(0, CASAS.findIndex(c => c.id === location.hash.slice(1)));
selecionar(ini, true);
camera.position.copy(posInicio()).multiplyScalar(1.35);
controls.target.copy(alvoInicio());
voa(posInicio(), alvoInicio(), 2.0);
addEventListener('hashchange', () => { const i = CASAS.findIndex(c => c.id === location.hash.slice(1)); if (i >= 0 && CASAS[i] !== DEF) selecionar(i); });
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let quadro = 0;
function loop() {
  if (anim) {
    const k = ease(Math.min((performance.now() - anim.t0) / 1000 / anim.dur, 1));
    camera.position.lerpVectors(anim.p0, anim.p1, k); controls.target.lerpVectors(anim.a0, anim.a1, k);
    if (k >= 1) { const f = anim.depois; anim = null; f && f(); }
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  if (++quadro % 6 === 0) organizaRotulos();
  requestAnimationFrame(loop);
}
loop();
const tiraCapa = () => document.getElementById('carregando').classList.add('fora');
requestAnimationFrame(() => setTimeout(tiraCapa, 400));
setTimeout(tiraCapa, 3000);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight); });
window.__p3d = { selecionar, focar: id => focar(AMB.find(a => a.id === id)), setVista, resetar, scene, camera, controls, get modo() { return modo; }, set modo(v) { modo = v; aplicaModo(); } };
