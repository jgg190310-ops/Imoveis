<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Planta 3D · Casa Batista · Marechal Deodoro-AL</title>
<meta name="description" content="Planta 3D interativa da casa de temporada em Marechal Deodoro-AL: 3 quartos, sala, cozinha, piscina com cascata, área gourmet com churrasqueira e vaga coberta.">
<meta name="theme-color" content="#06243f">
<meta property="og:title" content="Planta 3D · Casa Batista">
<meta property="og:description" content="Gire a casa com o dedo, tire a cobertura e entre em cada ambiente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Jost:wght@300..600&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#06243f; --azul-2:#0d3c66; --ciano:#2ea6d8; --ciano-2:#6fd0ee;
  --areia:#f6f2ea; --suave:#93a4b2;
  --sans:'Jost',system-ui,-apple-system,sans-serif;
  --display:'Archivo',system-ui,sans-serif;
  --borda:rgba(111,208,238,.32);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#cfe4ea;
  font:300 15px/1.6 var(--sans);color:var(--azul);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:var(--sans);color:inherit;cursor:pointer;border:0;background:none}
#cena{position:fixed;inset:0;touch-action:none}
#cena canvas{display:block}
#rotulos{position:fixed;inset:0;pointer-events:none;z-index:5}

.topo{position:fixed;z-index:30;top:max(12px,env(safe-area-inset-top));left:50%;
  transform:translateX(-50%);display:flex;align-items:center;gap:13px;
  padding:6px 6px 6px 16px;border-radius:999px;
  background:rgba(6,36,63,.7);backdrop-filter:blur(16px) saturate(1.35);
  -webkit-backdrop-filter:blur(16px) saturate(1.35);
  border:1px solid var(--borda);color:var(--areia);white-space:nowrap;
  box-shadow:0 14px 44px -20px rgba(0,0,0,.6);max-width:calc(100vw - 20px)}
.topo .marca{font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;
  display:flex;align-items:center;gap:9px;overflow:hidden;text-overflow:ellipsis}
.topo .marca svg{width:20px;height:20px;flex:none;color:var(--ciano-2)}
.topo a{color:#042033;text-decoration:none;font:700 11.5px var(--display);letter-spacing:.1em;
  text-transform:uppercase;padding:10px 16px;border-radius:999px;background:var(--ciano);
  transition:background .2s}
.topo a:hover{background:var(--ciano-2)}

.titulo{position:fixed;z-index:15;left:max(16px,env(safe-area-inset-left));top:78px;max-width:330px;
  padding:20px 22px;border-radius:18px;background:rgba(6,36,63,.9);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--borda);box-shadow:0 22px 54px -30px rgba(0,0,0,.8);
  transition:opacity .35s,transform .35s;color:rgba(246,242,234,.8)}
.titulo.fechado{opacity:0;transform:translateY(-10px);pointer-events:none}
.titulo small{display:block;font:700 9.5px var(--display);letter-spacing:.28em;
  text-transform:uppercase;color:var(--ciano-2);margin-bottom:9px}
.titulo h1{font:900 27px/1 var(--display);color:#fff;letter-spacing:-.03em;text-transform:uppercase}
.titulo h1 em{display:block;font-style:normal;color:var(--ciano-2)}
.titulo p{font-size:13.4px;line-height:1.6;margin-top:11px}
.titulo .fecha{position:absolute;top:8px;right:10px;width:30px;height:30px;border-radius:50%;
  font-size:20px;line-height:1;color:var(--suave);display:grid;place-items:center}
.titulo .fecha:hover{background:rgba(246,242,234,.12)}

.amb{position:fixed;z-index:15;right:max(13px,env(safe-area-inset-right));top:78px;
  width:214px;max-height:calc(100vh - 200px);overflow:auto;
  padding:11px;border-radius:18px;background:rgba(6,36,63,.88);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--borda);box-shadow:0 22px 54px -32px rgba(0,0,0,.8);
  scrollbar-width:thin;color:rgba(246,242,234,.86)}
.amb h4{font:700 9px var(--display);letter-spacing:.24em;text-transform:uppercase;
  color:var(--ciano-2);padding:9px 8px 5px}
.amb button{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:8px;
  padding:8px 10px;border-radius:9px;font-size:13.4px;text-align:left;transition:background .18s}
.amb button:hover{background:rgba(246,242,234,.1)}
.amb button.on{background:var(--ciano);color:#042033;font-weight:500}

.ctrl{position:fixed;z-index:20;left:50%;transform:translateX(-50%);
  bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:9px;
  padding:8px;border-radius:999px;background:rgba(6,36,63,.74);
  backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid var(--borda);box-shadow:0 16px 44px -22px rgba(0,0,0,.8);
  max-width:calc(100vw - 20px);overflow:auto;scrollbar-width:none}
.ctrl::-webkit-scrollbar{display:none}
.seg{display:flex;background:rgba(246,242,234,.12);border-radius:999px;padding:3px;flex:none}
.seg button{padding:8px 15px;border-radius:999px;font:400 12.5px var(--sans);
  color:rgba(246,242,234,.8);white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:var(--ciano);color:#042033;font-weight:500}
.ctrl .ic{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:rgba(246,242,234,.12);color:var(--areia);transition:background .2s}
.ctrl .ic:hover{background:rgba(46,166,216,.4)}
.ctrl .ic svg{width:18px;height:18px}

.rot{font:500 11.8px var(--sans);color:#fff;white-space:nowrap;
  padding:4px 10px;border-radius:999px;background:rgba(6,36,63,.84);
  border:1px solid rgba(111,208,238,.36);transition:opacity .25s;
  text-shadow:0 1px 3px rgba(0,0,0,.5)}
.rot.off{opacity:0}
.rot b{font-weight:500}

.dica{position:fixed;z-index:18;left:50%;transform:translateX(-50%);
  bottom:calc(max(16px,env(safe-area-inset-bottom)) + 62px);
  padding:8px 16px;border-radius:999px;background:rgba(6,36,63,.74);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--borda);color:rgba(246,242,234,.9);
  font:400 12.4px var(--sans);white-space:nowrap;transition:opacity .6s}
.dica.off{opacity:0;pointer-events:none}

#carregando{position:fixed;inset:0;z-index:95;display:grid;place-items:center;
  background:#cfe4ea;transition:opacity .5s}
#carregando.off{opacity:0;pointer-events:none}
#carregando div{display:grid;place-items:center;gap:14px}
#carregando b{font:900 20px var(--display);letter-spacing:-.02em;color:var(--azul);text-transform:uppercase}
#carregando i{display:block;width:44px;height:44px;border-radius:50%;
  border:3px solid rgba(6,36,63,.18);border-top-color:var(--ciano);
  animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

@media (max-width:900px){
  .amb{display:none}
  .titulo{max-width:min(300px,calc(100vw - 32px));top:72px;padding:16px 18px}
  .titulo h1{font-size:22px}
  .titulo p{font-size:12.6px}
  .topo{gap:9px;padding:5px 5px 5px 13px}
  .topo .marca{font-size:10.5px;letter-spacing:.12em}
  .topo a{font-size:10.5px;padding:9px 13px}
  .dica{font-size:11.6px;white-space:normal;max-width:calc(100vw - 28px);text-align:center}
  .ctrl{flex-wrap:wrap;justify-content:center;border-radius:26px;overflow:visible;
    gap:7px;padding:7px;max-width:calc(100vw - 22px)}
  .seg button{padding:8px 13px;font-size:12px}
  .ctrl .ic{width:34px;height:34px}
}
</style>
</head>
<body>

<div id="cena"></div>
<div id="rotulos"></div>

<div class="topo">
  <span class="marca">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 21h18"/><path d="M5 21V9l7-5 7 5v12"/><path d="M10 21v-6h4v6"/>
    </svg>
    Casa Batista
  </span>
  <a href="../">Voltar ao site</a>
</div>

<div class="titulo" id="titulo">
  <button class="fecha" id="fechaTitulo" aria-label="Fechar">&times;</button>
  <small>Planta 3D</small>
  <h1>Casa<em>Batista</em></h1>
  <p>Gire com o dedo, tire a cobertura e entre em cada ambiente. Modelo montado a partir das fotos e do vídeo da casa — medidas aproximadas.</p>
</div>

<div class="amb" id="amb"></div>

<div class="ctrl">
  <div class="seg" id="segCorte">
    <button data-n="fechado" class="on">Fechada</button>
    <button data-n="aberto">Sem telhado</button>
  </div>
  <div class="seg" id="segFoco">
    <button data-f="tudo" class="on">Tudo</button>
    <button data-f="casa">Quartos</button>
    <button data-f="lazer">Lazer</button>
  </div>
  <button class="ic" id="btnVista" title="Ver de cima" aria-label="Ver de cima">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
    </svg>
  </button>
  <button class="ic" id="btnReset" title="Vista inicial" aria-label="Vista inicial">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/>
    </svg>
  </button>
</div>

<div class="dica" id="dica">Arraste para girar · dois dedos para mover · pinça para aproximar</div>

<div id="carregando"><div><i></i><b>Montando a casa</b></div></div>

<script type="module">
import * as THREE from './vendor/three.module.min.js';
import { OrbitControls } from './vendor/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from './vendor/CSS2DRenderer.js';

/* ===================== BASE ===================== */
const host = document.getElementById('cena');
const MOBILE = innerWidth < 900 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

const renderer = new THREE.WebGLRenderer({ antialias: !MOBILE, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
host.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer({ element: document.getElementById('rotulos') });
labelRenderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfe4ea');
scene.fog = new THREE.Fog('#cfe4ea', 60, 180);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .07;
controls.minDistance = 7;
controls.maxDistance = 110;
controls.maxPolarAngle = Math.PI / 2 - .03;

/* ===================== LUZ ===================== */
scene.add(new THREE.HemisphereLight('#eef8ff', '#c3b89a', .95));
const sol = new THREE.DirectionalLight('#fff4e0', 2.9);
sol.position.set(-22, 34, 12);
sol.castShadow = true;
sol.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
sol.shadow.camera.left = -24; sol.shadow.camera.right = 24;
sol.shadow.camera.top = 34; sol.shadow.camera.bottom = -26;
sol.shadow.camera.near = 1; sol.shadow.camera.far = 100;
sol.shadow.bias = -0.0006;
sol.shadow.normalBias = 0.045;
scene.add(sol);
scene.add(new THREE.DirectionalLight('#dceeff', .4).translateX(18).translateY(14).translateZ(-20));

/* ===================== MEDIDAS =====================
   X = largura do terreno (0 a 18)  |  Z = profundidade (0 na rua, 27 no fundo)
   Casa térrea no fundo do lote, quintal gramado na frente,
   piscina no meio, área gourmet na lateral esquerda, vaga coberta na direita. */
const LOTE = { x0: 0, x1: 18, z0: 0, z1: 27 };

const ESP = .15;
const PD  = 2.9;          /* pé-direito */
const ALT_COB = 2.75;     /* pé-direito da área coberta */

const CASA = { x0: 3.4, x1: 15.6, z0: 18.2, z1: 26.0 };

const T = {
  sala:    { x0: 3.4,  x1: 9.4,  z0: 18.2, z1: 22.2, n: 'Sala de estar' },
  cozinha: { x0: 9.4,  x1: 15.6, z0: 18.2, z1: 22.2, n: 'Cozinha' },
  corre:   { x0: 4.6,  x1: 15.6, z0: 22.2, z1: 23.4, n: 'Corredor' },
  quarto1: { x0: 3.4,  x1: 7.0,  z0: 23.4, z1: 26.0, n: 'Quarto 1' },
  quarto2: { x0: 7.0,  x1: 10.6, z0: 23.4, z1: 26.0, n: 'Quarto 2' },
  wc:      { x0: 10.6, x1: 12.6, z0: 23.4, z1: 26.0, n: 'Banheiro' },
  quarto3: { x0: 12.6, x1: 15.6, z0: 23.4, z1: 26.0, n: 'Quarto 3' }
};

const EXT = {
  gourmet: { x0: 1.1,  x1: 7.2,  z0: 12.0, z1: 17.4, n: 'Área gourmet' },
  piscina: { x0: 9.6,  x1: 14.4, z0: 7.6,  z1: 11.6, n: 'Piscina' },
  garagem: { x0: 11.4, x1: 16.6, z0: 13.4, z1: 18.0, n: 'Vaga coberta' },
  quintal: { x0: 2.0,  x1: 16.2, z0: 2.0,  z1: 11.4, n: 'Quintal' }
};

/* ===================== MATERIAIS ===================== */
const std = o => new THREE.MeshStandardMaterial(Object.assign({ roughness: .9, metalness: 0 }, o));
const M = {
  paredeExt: std({ color: '#e9eaea', roughness: .95 }),
  paredeInt: std({ color: '#f2f1ec' }),
  grafite:   std({ color: '#5c6468', roughness: .9 }),
  tijolo:    std({ color: '#c99a62', roughness: .97 }),
  tijoloEsc: std({ color: '#a8794a', roughness: .98 }),
  piso:      std({ color: '#eceae3', roughness: .4 }),
  pisoMolh:  std({ color: '#ded8cb', roughness: .44 }),
  pisoMad:   std({ color: '#b08a5e', roughness: .74 }),
  concreto:  std({ color: '#d4d1c8', roughness: .99 }),
  laje:      std({ color: '#cfccc4', roughness: .95 }),
  telha:     std({ color: '#b1664a', roughness: .94 }),
  telhaBorda:std({ color: '#7d4530', roughness: .92 }),
  caibro:    std({ color: '#8a5c33', roughness: .88 }),
  granito:   std({ color: '#2c2a27', roughness: .3, metalness: .16 }),
  madeira:   std({ color: '#9a6334', roughness: .62 }),
  madClara:  std({ color: '#b4813f', roughness: .76 }),
  movel:     std({ color: '#d9d2c4', roughness: .78 }),
  armCinza:  std({ color: '#55595c', roughness: .72 }),
  inox:      std({ color: '#b5bab9', roughness: .32, metalness: .55 }),
  branco:    std({ color: '#f8f7f3', roughness: .55 }),
  cama:      std({ color: '#e4ded0', roughness: .95 }),
  colcha:    std({ color: '#cdd3da', roughness: .96 }),
  preto:     std({ color: '#241f1a', roughness: .48 }),
  grama:     std({ color: '#79983f', roughness: 1 }),
  gramaEsc:  std({ color: '#5f7d32', roughness: 1 }),
  terra:     std({ color: '#b3a881', roughness: 1 }),
  agua:      new THREE.MeshStandardMaterial({ color: '#17b2dd', roughness: .08, metalness: .18, transparent: true, opacity: .95, emissive: '#0a5a72', emissiveIntensity: .3 }),
  vidro:     new THREE.MeshPhysicalMaterial({ color: '#cfe2e6', roughness: .06, metalness: 0, transparent: true, opacity: .26, transmission: .5 }),
  esquadria: std({ color: '#2f2a26', roughness: .5 }),
  folha:     std({ color: '#4e7a3c', roughness: 1 }),
  folhaEsc:  std({ color: '#3d6330', roughness: 1 }),
  tronco:    std({ color: '#7a6244', roughness: 1 }),
  asfalto:   std({ color: '#8f9195', roughness: 1 }),
  muro:      std({ color: '#eceadf', roughness: .95 }),
  muroLat:   std({ color: '#e3e0d4', roughness: .96 }),
  portao:    std({ color: '#9aa0a4', roughness: .5, metalness: .3 }),
  cadeira:   std({ color: '#f4f4f1', roughness: .7 }),
  cadeiraPreta: std({ color: '#2a2a2a', roughness: .66 }),
  sofa:      std({ color: '#6b584a', roughness: .95 }),
  sofa2:     std({ color: '#9b8e81', roughness: .95 }),
  tapete:    std({ color: '#cfc6b4', roughness: 1 }),
  vaso:      std({ color: '#b9b2a4', roughness: .94 }),
  carro:     std({ color: '#2f3337', roughness: .42, metalness: .3 }),
  vidroCarro:new THREE.MeshPhysicalMaterial({ color: '#7f8b92', roughness: .12, metalness: .2, transparent: true, opacity: .7 })
};

/* ===================== GRUPOS ===================== */
const TETOS = [];
const G = {
  terreno:   new THREE.Group(),
  casa:      new THREE.Group(),
  mob:       new THREE.Group(),
  cobertura: new THREE.Group(),
  lazer:     new THREE.Group()
};
Object.values(G).forEach(g => scene.add(g));
const CX = (LOTE.x0 + LOTE.x1) / 2, CZ = (LOTE.z0 + LOTE.z1) / 2;
Object.values(G).forEach(g => g.position.set(-CX, 0, -CZ));

/* ===================== AJUDANTES ===================== */
function caixa(g, w, h, d, mat, x, y, z, sombra = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y + h / 2, z);
  m.castShadow = sombra; m.receiveShadow = true;
  g.add(m);
  return m;
}
function piso(g, r, mat, y = 0, esp = .07) {
  return caixa(g, r.x1 - r.x0, esp, r.z1 - r.z0, mat,
    (r.x0 + r.x1) / 2, y - esp, (r.z0 + r.z1) / 2, false);
}
function parede(g, eixo, fixo, a0, a1, y, alt, mat, vaos = []) {
  const segs = [];
  let cur = a0;
  const ord = vaos.slice().sort((p, q) => p.a - q.a);
  for (const v of ord) {
    const va = Math.max(a0, v.a), vb = Math.min(a1, v.b);
    if (vb <= va) continue;
    if (va > cur) segs.push([cur, va, y, alt]);
    const vy0 = v.y0 ?? 0, vy1 = v.y1 ?? alt;
    if (vy0 > 0) segs.push([va, vb, y, vy0]);
    if (vy1 < alt) segs.push([va, vb, y + vy1, alt - vy1]);
    cur = Math.max(cur, vb);
  }
  if (cur < a1) segs.push([cur, a1, y, alt]);
  for (const [s0, s1, sy, sh] of segs) {
    if (s1 - s0 < .005 || sh < .005) continue;
    if (eixo === 'x') caixa(g, s1 - s0, sh, ESP, mat, (s0 + s1) / 2, sy, fixo);
    else caixa(g, ESP, sh, s1 - s0, mat, fixo, sy, (s0 + s1) / 2);
  }
  for (const v of ord) {
    if (!v.vidro) continue;
    const vy0 = v.y0 ?? 0, vy1 = v.y1 ?? alt;
    const w = v.b - v.a, h = vy1 - vy0;
    if (w <= 0 || h <= 0) continue;
    if (eixo === 'x') {
      caixa(g, w, h, .04, M.vidro, (v.a + v.b) / 2, y + vy0, fixo, false);
      caixa(g, w, .07, .09, M.esquadria, (v.a + v.b) / 2, y + vy0, fixo, false);
      caixa(g, w, .07, .09, M.esquadria, (v.a + v.b) / 2, y + vy1 - .07, fixo, false);
    } else {
      caixa(g, .04, h, w, M.vidro, fixo, y + vy0, (v.a + v.b) / 2, false);
      caixa(g, .09, .07, w, M.esquadria, fixo, y + vy0, (v.a + v.b) / 2, false);
      caixa(g, .09, .07, w, M.esquadria, fixo, y + vy1 - .07, (v.a + v.b) / 2, false);
    }
  }
}
/* coluna de tijolinho aparente, como as da área gourmet */
function coluna(g, x, z, alt, lado = .42) {
  caixa(g, lado, alt, lado, M.tijolo, x, 0, z);
  for (let y = .18; y < alt - .1; y += .36) caixa(g, lado + .04, .1, lado + .04, M.tijoloEsc, x, y, z, false);
}
/* laje plana com platibanda, como a fachada da casa */
function laje(g, r, y, borda = .3) {
  const w = r.x1 - r.x0 + borda * 2, d = r.z1 - r.z0 + borda * 2;
  const cx = (r.x0 + r.x1) / 2, cz = (r.z0 + r.z1) / 2;
  const t = caixa(g, w, .18, d, M.laje, cx, y, cz);
  caixa(g, w + .06, .42, .16, M.grafite, cx, y + .14, r.z0 - borda, false);
  caixa(g, w + .06, .42, .16, M.grafite, cx, y + .14, r.z1 + borda, false);

/* telhado de telha de barro, uma água, subindo no sentido +z */
function telhadoTelha(g, r, yBaixo, yAlto, beiral = .5) {
  const w = r.x1 - r.x0 + beiral * 2, d = r.z1 - r.z0 + beiral * 2;
  const cx = (r.x0 + r.x1) / 2, cz = (r.z0 + r.z1) / 2;
  const dy = yAlto - yBaixo;
  const ang = Math.atan2(dy, d);
  const len = Math.sqrt(d * d + dy * dy);
  /* caibros aparentes por baixo */
  for (let x = r.x0 + .4; x < r.x1; x += .62) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(.07, .07, len), M.caibro);
    c.position.set(x, (yBaixo + yAlto) / 2 - .12, cz);
    c.rotation.x = -ang;
    g.add(c);
  }
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, .12, len), M.telha);
  m.position.set(cx, (yBaixo + yAlto) / 2, cz);
  m.rotation.x = -ang;
  m.castShadow = true; m.receiveShadow = true;
  g.add(m);
  const f = new THREE.Mesh(new THREE.BoxGeometry(w, .18, .16), M.telhaBorda);
  f.position.set(cx, yBaixo - .04, r.z0 - beiral);
  g.add(f);
  return m;
}
function coqueiro(g, x, z, h = 5.4) {
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(.14, .26, h, 7), M.tronco);
  tr.position.set(x, h / 2, z); tr.castShadow = true; g.add(tr);
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * Math.PI * 2;
    const f = new THREE.Mesh(new THREE.SphereGeometry(1.3, 7, 5), i % 2 ? M.folha : M.folhaEsc);
    f.scale.set(1, .18, .5);
    f.position.set(x + Math.cos(a) * 1.1, h - .15 - Math.abs(Math.sin(i)) * .2, z + Math.sin(a) * 1.1);
    f.rotation.y = -a; f.rotation.z = -.3;
    f.castShadow = true; g.add(f);
  }
}
function arvore(g, x, z, h = 4.2) {
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(.16, .24, h, 6), M.tronco);
  tr.position.set(x, h / 2, z); tr.castShadow = true; g.add(tr);
  for (let i = 0; i < 3; i++) {
    const c = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5 - i * .25, 1), i % 2 ? M.folha : M.folhaEsc);
    c.position.set(x + (i - 1) * .5, h - .2 + i * .5, z + (i % 2 ? .4 : -.4));
    c.castShadow = true; g.add(c);
  }
}
function arbusto(g, x, z, r = .55) {
  const c = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), M.folha);
  c.position.set(x, r * .82, z); c.castShadow = true; c.receiveShadow = true; g.add(c);
}
/* cama: casal (1.4 x 1.9) ou solteiro (.9 x 1.9) */
function cama(g, x, z, solteiro = false, girada = false) {
  const lar = solteiro ? .9 : 1.45;
  const w = girada ? 1.9 : lar, d = girada ? lar : 1.9;
  caixa(g, w, .32, d, M.preto, x, 0, z);

  if (girada) {
    if (solteiro) caixa(g, .3, .1, .5, M.cama, x - w / 2 + .28, .54, z, false);
    else { caixa(g, .3, .1, .46, M.cama, x - w / 2 + .28, .54, z - .3, false);
           caixa(g, .3, .1, .46, M.cama, x - w / 2 + .28, .54, z + .3, false); }
  } else {
    if (solteiro) caixa(g, .5, .1, .3, M.cama, x, .54, z - d / 2 + .28, false);

           caixa(g, .46, .1, .3, M.cama, x + .3, .54, z - d / 2 + .28, false); }

}

function cadeiras(g, cx, cz, n, raioX, raioZ, mat) {
  for (let i = 0; i < n; i++) {

    const x = cx + Math.cos(a) * raioX, z = cz + Math.sin(a) * raioZ;

    caixa(g, .44, .5, .08, mat, x, .42, z + (Math.sin(a) > 0 ? .18 : -.18), false);
  }
}

  coluna(g, V.x1 - .3, V.z0 + .3, ALT_COB);
  const cob = caixa(G.cobertura, V.x1 - V.x0 + .5, .22, V.z1 - V.z0 + .3, M.laje,
    (V.x0 + V.x1) / 2, ALT_COB + .14, (V.z0 + V.z1) / 2);
  caixa(G.cobertura, V.x1 - V.x0 + .6, .34, .16, M.grafite, (V.x0 + V.x1) / 2, ALT_COB + .3, V.z0 - .15, false);
  TETOS.push(cob);
  /* carro */
  const cx = 14.0, cz = 15.6;
  caixa(g, 1.85, .62, 4.3, M.carro, cx, .5, cz);
  caixa(g, 1.68, .56, 2.2, M.vidroCarro, cx, 1.12, cz + .1, false);
  caixa(g, 1.9, .3, 1.1, M.carro, cx, 1.12, cz - 1.4, false);
  for (const p of [[-.86, 1.45], [.86, 1.45], [-.86, -1.45], [.86, -1.45]]) {
    const r = new THREE.Mesh(new THREE.CylinderGeometry(.34, .34, .22, 14), M.preto);
    r.rotation.z = Math.PI / 2; r.position.set(cx + p[0], .36, cz + p[1]);
    r.castShadow = true; g.add(r);
  }

  /* vasos e detalhes no quintal */
  for (const p of [[8.6, 13.0], [9.8, 13.0]]) {
    caixa(g, .42, .5, .42, M.vaso, p[0], .05, p[1]);
    arbusto(g, p[0], p[1] + .02, .34);
  }
})();

/* ===================== RÓTULOS ===================== */
const rotulos = [];
function rotulo(r, grupo, y) {
  const el = document.createElement('div');
  el.className = 'rot';
  el.innerHTML = '<b>' + r.n + '</b>';
  const o = new CSS2DObject(el);
  o.position.set((r.x0 + r.x1) / 2 - CX, y, (r.z0 + r.z1) / 2 - CZ);
  scene.add(o);
  rotulos.push({ o, el, piso: grupo });
  return o;
}
[T.sala, T.cozinha, T.quarto1, T.quarto2, T.quarto3, T.wc].forEach(r => rotulo(r, 'casa', 1.9));
Object.values(EXT).forEach(r => rotulo(r, 'ext', 1.3));

/* ===================== CÂMERA E ESTADO ===================== */
const ALVO = new THREE.Vector3(0, 1.0, 1.5);
const VISTA_INICIAL = MOBILE ? new THREE.Vector3(-8, 32, -46) : new THREE.Vector3(-14, 21, -30);

function irPara(pos, alvo, ms = 900) {
  const p0 = camera.position.clone(), a0 = controls.target.clone();
  const t0 = performance.now();
  (function anima() {
    const k = Math.min(1, (performance.now() - t0) / ms);
    const e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(p0, pos, e);
    controls.target.lerpVectors(a0, alvo, e);
    controls.update();
    if (k < 1) requestAnimationFrame(anima);
  })();
}
function reset() { irPara(VISTA_INICIAL.clone(), ALVO.clone()); }
camera.position.copy(VISTA_INICIAL);
controls.target.copy(ALVO);
controls.update();

let aberto = false, foco = 'tudo', emPlanta = false;

function aplicar() {
  G.casa.visible = G.mob.visible = foco !== 'lazer';
  G.lazer.visible = foco !== 'casa';
  G.cobertura.visible = !aberto;
  TETOS.forEach(t => { t.visible = !aberto; });
  rotulos.forEach(r => {
    let ok = false;
    if (r.piso === 'casa') ok = aberto && foco !== 'lazer';
    if (r.piso === 'ext') ok = foco !== 'casa';
    r.el.classList.toggle('off', !ok);
  });
}
aplicar();

/* ===================== CONTROLES ===================== */
function seg(id, attr, fn) {
  const box = document.getElementById(id);
  box.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...box.children].forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    fn(b.getAttribute(attr));
  });
}
seg('segCorte', 'data-n', v => { aberto = v === 'aberto'; aplicar(); });
seg('segFoco', 'data-f', v => {
  foco = v;
  if (v === 'casa') {
    aberto = true;
    document.querySelectorAll('#segCorte button').forEach(b => b.classList.toggle('on', b.dataset.n === 'aberto'));
    aplicar();
    irPara(new THREE.Vector3(-4, 19, -4), new THREE.Vector3(.5, 1.2, 8.6));
  } else if (v === 'lazer') {
    aplicar();
    irPara(new THREE.Vector3(-6, 16, -16), new THREE.Vector3(.8, .4, -3.0));
  } else { aplicar(); reset(); }
});
document.getElementById('btnReset').addEventListener('click', () => {
  aberto = false; foco = 'tudo'; emPlanta = false;
  document.querySelectorAll('#segCorte button').forEach(b => b.classList.toggle('on', b.dataset.n === 'fechado'));
  document.querySelectorAll('#segFoco button').forEach(b => b.classList.toggle('on', b.dataset.f === 'tudo'));
  aplicar(); reset();
});
document.getElementById('btnVista').addEventListener('click', () => {
  emPlanta = !emPlanta;
  if (emPlanta) {
    aberto = true;
    document.querySelectorAll('#segCorte button').forEach(b => b.classList.toggle('on', b.dataset.n === 'aberto'));
    aplicar();
    irPara(new THREE.Vector3(0, 46, .01), new THREE.Vector3(0, 0, 0));
  } else {
    aberto = false;
    document.querySelectorAll('#segCorte button').forEach(b => b.classList.toggle('on', b.dataset.n === 'fechado'));
    aplicar(); reset();
  }
});
document.getElementById('fechaTitulo').addEventListener('click', () =>
  document.getElementById('titulo').classList.add('fechado'));

/* lista de ambientes */
const ambBox = document.getElementById('amb');
const GRUPOS = [
  ['Dentro da casa', [T.sala, T.cozinha, T.quarto1, T.quarto2, T.quarto3, T.wc], 'casa'],
  ['Área externa', [EXT.piscina, EXT.gourmet, EXT.garagem, EXT.quintal], 'ext']
];
let botaoAtivo = null;
GRUPOS.forEach(([titulo, itens, tipo]) => {
  const h = document.createElement('h4'); h.textContent = titulo; ambBox.appendChild(h);
  itens.forEach(r => {
    const b = document.createElement('button');
    b.innerHTML = '<span>' + r.n + '</span>';
    b.addEventListener('click', () => {
      if (botaoAtivo) botaoAtivo.classList.remove('on');
      b.classList.add('on'); botaoAtivo = b;
      aberto = true;
      document.querySelectorAll('#segCorte button').forEach(x => x.classList.toggle('on', x.dataset.n === 'aberto'));
      foco = 'tudo';
      document.querySelectorAll('#segFoco button').forEach(x => x.classList.toggle('on', x.dataset.f === 'tudo'));
      aplicar();
      const cx = (r.x0 + r.x1) / 2 - CX, cz = (r.z0 + r.z1) / 2 - CZ;
      const maior = Math.max(r.x1 - r.x0, r.z1 - r.z0);
      const raio = Math.max(12.5, maior * (MOBILE ? 3.0 : 2.5));
      irPara(new THREE.Vector3(cx - raio * .6, .8 + raio * .85, cz - raio * .6),
             new THREE.Vector3(cx, .8, cz));
    });
    ambBox.appendChild(b);
  });
});

/* ===================== LOOP ===================== */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
}, { passive: true });

let primeiroQuadro = true;
(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  if (primeiroQuadro) {
    primeiroQuadro = false;
    setTimeout(() => document.getElementById('carregando').classList.add('off'), 280);
  }
})();

setTimeout(() => document.getElementById('dica').classList.add('off'), 5400);
setTimeout(() => document.getElementById('titulo').classList.add('fechado'), MOBILE ? 6800 : 9500);
</script>
</body>
